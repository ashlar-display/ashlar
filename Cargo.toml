[package]
name = "ashlar"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "A display connection stack in Rust: EDID parsing, HDMI 2.1 mode negotiation, InfoFrames, SCDC, FRL link training and TMDS link parameters"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/ashlar"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "edid", "display"]
categories = ["hardware-support", "embedded", "no-std"]
include = ["src/**", "doc/**", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = [
    "alloc",
    "display-types?/std",
    "piaf?/std",
    "concordance?/std",
    "cartouche?/std",
    "plumbob?/std",
    "plumbob-async?/std",
]
alloc = [
    "display-types?/alloc",
    "piaf?/alloc",
    "concordance?/alloc",
    "cartouche?/alloc",
    "plumbob?/alloc",
    "plumbob-async?/alloc",
]
# With culvert enabled too, culvert's `Scdc` drives plumbob's `FrlTrainer` (and
# culvert-async's drives plumbob-async's).
plumbob = ["dep:plumbob", "culvert?/plumbob"]
plumbob-async = ["dep:plumbob-async", "culvert-async?/plumbob-async"]
# With display-types enabled too, spiritlevel's sink facts convert from display-types'
# `HdmiForumSinkCap`.
display-types = ["dep:display-types", "spiritlevel?/display-types"]
spiritlevel = ["dep:spiritlevel"]
full = [
    "display-types",
    "piaf",
    "concordance",
    "cartouche",
    "culvert",
    "culvert-async",
    "plumbob",
    "plumbob-async",
    "spiritlevel",
    "hdmi-hal",
    "hdmi-hal-async",
    "hdmi-hal-i2c-dev",
]

[dependencies]
display-types = { version = "0.5.1", optional = true, default-features = false }
piaf = { version = "0.6.0", optional = true, default-features = false }
concordance = { version = "0.3.0", optional = true, default-features = false }
cartouche = { version = "0.3.1", optional = true, default-features = false }
culvert = { version = "0.3.1", optional = true, default-features = false }
culvert-async = { version = "0.3.1", optional = true, default-features = false }
plumbob = { version = "0.4.1", optional = true, default-features = false }
plumbob-async = { version = "0.3.1", optional = true, default-features = false }
spiritlevel = { version = "0.1.0", optional = true, default-features = false }
hdmi-hal = { version = "0.6.1", optional = true, default-features = false }
hdmi-hal-async = { version = "0.3.1", optional = true, default-features = false }
hdmi-hal-i2c-dev = { version = "0.4.0", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
