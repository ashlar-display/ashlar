[package]
name = "ashlar"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A display connection stack in Rust: EDID parsing, HDMI 2.1 mode negotiation, InfoFrames, SCDC and FRL link training"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/ashlar"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "edid", "display"]
categories = ["hardware-support", "embedded", "no-std"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = [
    "alloc",
    "display-types?/std",
    "piaf?/std",
    "concordance?/std",
    "cartouche?/std",
    "plumbob?/std",
    "plumbob-async?/std",
]
alloc = [
    "display-types?/alloc",
    "piaf?/alloc",
    "concordance?/alloc",
    "cartouche?/alloc",
    "plumbob?/alloc",
    "plumbob-async?/alloc",
]
full = [
    "display-types",
    "piaf",
    "concordance",
    "cartouche",
    "culvert",
    "culvert-async",
    "plumbob",
    "plumbob-async",
    "hdmi-hal",
    "hdmi-hal-async",
    "hdmi-hal-i2c-dev",
]

[dependencies]
display-types = { version = "0.4.3", optional = true, default-features = false }
piaf = { version = "0.4.2", optional = true, default-features = false }
concordance = { version = "0.2.0", optional = true, default-features = false }
cartouche = { version = "0.3.0", optional = true, default-features = false }
culvert = { version = "0.3.0", optional = true, default-features = false }
culvert-async = { version = "0.3.0", optional = true, default-features = false }
plumbob = { version = "0.4.0", optional = true, default-features = false }
plumbob-async = { version = "0.3.0", optional = true, default-features = false }
hdmi-hal = { version = "0.6.0", optional = true, default-features = false }
hdmi-hal-async = { version = "0.3.0", optional = true, default-features = false }
hdmi-hal-i2c-dev = { version = "0.3.0", optional = true }
