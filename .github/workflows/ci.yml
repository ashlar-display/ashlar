name: CI

on:
  push:
    branches: [main, develop]
  # Not main: the only PRs into main are release-tag's release-promote/* PRs,
  # whose content already passed CI on develop. Opened by github-actions[bot],
  # their runs would be held for approval and end as action_required/failure.
  pull_request:
    branches: [develop]

# Read-only: no job here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: No [patch] on main
        # A [patch] points a dependency at unreleased code for a prototype; cargo package
        # drops it, so a release built with one would not build from crates.io.
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -q '^\[patch' Cargo.toml; then
            echo "::error::Cargo.toml has a [patch] section; remove it before release"
            exit 1
          fi

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (every feature)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      # docs.rs builds with every feature, so the docs are checked the same way.
      - name: Docs
        run: cargo rustdoc --locked --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      # Every stack crate is an optional feature; each must build on its own.
      - name: Build (each feature)
        run: |
          for FEATURE in $(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[0].features | keys[] | select(. != "default" and . != "std" and . != "alloc" and . != "full")'); do
            echo "::group::$FEATURE"
            cargo build --locked --features "$FEATURE"
            echo "::endgroup::"
          done

      - name: Build (no_std)
        run: >-
          cargo build --locked --no-default-features --target thumbv7em-none-eabi
          --features display-types,piaf,concordance,cartouche,culvert,culvert-async,plumbob,plumbob-async,spiritlevel,hdmi-hal,hdmi-hal-async

  # cargo-msrv reads the MSRV from Cargo.toml's rust-version and runs the checks on that
  # toolchain. Built from crates.io with --locked at a pinned version, not install-action:
  # it has no manifest for cargo-msrv and would fall back to an unpinned cargo-binstall
  # download. Dependabot does not bump CARGO_MSRV_VERSION; bump it by hand.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      CARGO_MSRV_VERSION: 0.19.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restore and save are separate steps so the binary is cached as soon as it is
      # built: a combined cache step saves only when the whole job succeeds, so while the
      # MSRV is broken every run would rebuild cargo-msrv.
      - name: Restore cargo-msrv
        id: msrv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-msrv
          key: ${{ runner.os }}-cargo-msrv-${{ env.CARGO_MSRV_VERSION }}

      - name: Install cargo-msrv
        if: steps.msrv-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-msrv --version "${CARGO_MSRV_VERSION}" --locked

      - name: Save cargo-msrv
        if: steps.msrv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-msrv
          key: ${{ runner.os }}-cargo-msrv-${{ env.CARGO_MSRV_VERSION }}

      - name: Verify MSRV (test, every feature)
        run: cargo msrv verify -- cargo test --locked --all-features

      - name: Verify MSRV (no_std)
        run: >
          cargo msrv verify --target thumbv7em-none-eabi
          -- cargo build --locked --no-default-features --target thumbv7em-none-eabi
          --features display-types,piaf,concordance,cartouche,culvert,culvert-async,plumbob,plumbob-async,spiritlevel,hdmi-hal,hdmi-hal-async
